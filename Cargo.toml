[package]
name = "egui_tabular"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Customizable egui table viewer and editor"

[workspace]
members = ["demos/*", "tabular_core", "tabular_derive", "tests"]
[workspace.package]
version = "0.3.0"
edition = "2024"
repository = "https://github.com/romixlab/egui_tabular"
license = "MIT OR Apache-2.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]

[workspace.dependencies]
eframe = { version = "0.36", features = ["serde", "persistence"] }
egui = { version = "0.36" }
egui_tabular = { path = ".", version = "0.3" }
rvariant = { version = "0.5", default-features = false, features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
tabular_core = { version = "0.3", path = "./tabular_core" }
tabular_derive = { version = "0.3", path = "./tabular_derive" }

[dependencies]
chardetng = "1.0"
chrono = "0.4"
csv = "1.3"
egui.workspace = true
encoding_rs = "0.8"
encoding_rs_io = "0.1"
indexmap = "2"
itertools = "0.15"
log = "0.4"
rvariant = { workspace = true }
serde = { version = "1", features = ["derive"] }
strum = { workspace = true }
tabular_core = { workspace = true }
tabular_derive = { workspace = true }
tap = "1.0"

# The CSV export's save dialog: native only, the web has none (EXPORT-4)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
serde_json = "1"

# Until rvariant 0.5 and si_dynamic 0.3 are published: our own repos at fixed tags.
[patch.crates-io]
rvariant = { git = "https://github.com/romixlab/rvariant", tag = "v0.5.1" }
si_dynamic = { git = "https://github.com/romixlab/si_dynamic", tag = "v0.3.0" }
